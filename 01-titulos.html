<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conhecendo os títulos</title>
</head>

<body>
    <!--Conhecendo a hierarquia de uma página
h1 - podemos usar somente uma vez, é o título principal de uma página-->

    <h1>Bem-vindo ao meu site!</h1>
    <p>Este site aborda o básico sobre elementos de título</p>
    
    <h2>Este é um título de nível 2</h2>
    <h3>Este é um título de nível 3</h3>
    <h4>Este é um título de nível 4</h4>
    <h5>Este é um título de nível 5</h5>
    <h6>Este é um título de nível 6</h6>
</body>

</html>
